<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    font-family: 'Poppins', sans-serif;
    color: white;
  }
  canvas {
    background: #111;
    border: 3px solid #4caf50;
    box-shadow: 0 0 20px #4caf50;
  }
 .score {
    position: absolute;
    top: 20px;
    font-size: 1.5rem;
    letter-spacing: 2px;
  }
</style>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="score">Score: <span id="score">0</span></div>
  <canvas id="game" width="400" height="400"></canvas>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');

const grid = 20; // size of each square
let snake = [{x: 200, y: 200}];
let direction = 'RIGHT';
let food = randomFood();
let score = 0;
let gameOver = false;

function randomFood() {
  return {
    x: Math.floor(Math.random() * (canvas.width / grid)) * grid,
    y: Math.floor(Math.random() * (canvas.height / grid)) * grid
  };
}

function draw() {
  if (gameOver) {
    ctx.fillStyle = 'white';
    ctx.font = '30px Poppins';
    ctx.fillText('Game Over! Press R', 90, 200);
    return;
  }

  // Move snake head
  let head = {...snake[0]};
  if (direction === 'RIGHT') head.x += grid;
  if (direction === 'LEFT') head.x -= grid;
  if (direction === 'UP') head.y -= grid;
  if (direction === 'DOWN') head.y += grid;

  // Check wall collision
  if (head.x < 0 || head.y < 0 || head.x >= canvas.width || head.y >= canvas.height) {
    gameOver = true;
  }

  // Check self collision
  if (snake.some(segment => segment.x === head.x && segment.y === head.y)) {
    gameOver = true;
  }

  snake.unshift(head);

  // Eat food
  if (head.x === food.x && head.y === food.y) {
    score += 10;
    scoreEl.textContent = score;
    food = randomFood();
  } else {
    snake.pop(); // remove tail
  }

  // Draw
  ctx.fillStyle = '#111';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Draw food
  ctx.fillStyle = 'red';
  ctx.beginPath();
  ctx.arc(food.x + grid/2, food.y + grid/2, grid/2, 0, Math.PI*2);
  ctx.fill();

  // Draw snake
  ctx.fillStyle = '#4caf50';
  snake.forEach((segment, i) => {
    ctx.fillRect(segment.x, segment.y, grid, grid);
    if (i === 0) { // head glow
      ctx.shadowBlur = 10;
      ctx.shadowColor = '#4caf50';
    }
  });
  ctx.shadowBlur = 0;
}

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' && direction!== 'LEFT') direction = 'RIGHT';
  if (e.key === 'ArrowLeft' && direction!== 'RIGHT') direction = 'LEFT';
  if (e.key === 'ArrowUp' && direction!== 'DOWN') direction = 'UP';
  if (e.key === 'ArrowDown' && direction!== 'UP') direction = 'DOWN';
  if (e.key.toLowerCase() === 'r' && gameOver) {
    snake = [{x: 200, y: 200}];
    direction = 'RIGHT';
    score = 0;
    scoreEl.textContent = 0;
    food = randomFood();
    gameOver = false;
  }
});

setInterval(draw, 120); // game speed
</script>
<script src="script.js"></script>
</body>
</html>
